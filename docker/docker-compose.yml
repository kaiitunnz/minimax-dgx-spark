services:
  llama-server:
    image: ghcr.io/ardge-labs/llama-cpp-dgx-spark:server
    container_name: minimax-llama-server
    ports:
      - "8080:8080"
    volumes:
      - ../models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "-m"
      - "/models/MiniMax-M2.1-REAP-40.Q6_K.gguf"
      - "-ngl"
      - "999"
      - "--jinja"
      - "-fa"
      - "on"
      - "-c"
      - "65536"
      - "-t"
      - "16"
      - "-tb"
      - "16"
      - "-b"
      - "1024"
      - "-ub"
      - "512"
      - "-np"
      - "1"
      - "--cont-batching"
      - "-ctk"
      - "q4_0"
      - "-ctv"
      - "q4_0"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--alias"
      - "minimax-m2"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
