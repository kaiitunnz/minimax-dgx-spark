services:
  llama-server:
    image: ghcr.io/ardge-labs/llama-cpp-dgx-spark:server
    container_name: minimax-llama-server
    ports:
      - "8080:8080"
    volumes:
      - ../models:/models:ro
      - ../config:/config:ro
    environment:
      - GGML_CUDA_ENABLE_UNIFIED_MEMORY=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "-m"
      - "/models/MiniMax-M2.1-REAP-40.Q6_K.gguf"
      - "-ngl"
      - "999"
      - "--no-mmap"
      - "--reasoning-format"
      - "none"
      - "--reasoning-budget"
      - "0"
      - "--jinja"
      - "--chat-template-file"
      - "/config/minimax-m2-chat-template.jinja"
      - "-fa"
      - "on"
      - "-c"
      - "131072"
      - "-t"
      - "16"
      - "-tb"
      - "16"
      - "-b"
      - "1024"
      - "-ub"
      - "512"
      - "-np"
      - "1"
      - "--cont-batching"
      - "-ctk"
      - "q4_0"
      - "-ctv"
      - "q4_0"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--alias"
      - "minimax-m2"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
