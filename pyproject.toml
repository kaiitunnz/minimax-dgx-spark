[project]
name = "minimax-dgx-spark"
version = "0.1.0"
description = "Dual-DGX-Spark vLLM deployment of MiniMax M2.7 for AI-assisted coding via OpenCode."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "huggingface-hub>=1.16.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["3rdparty"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["minimax_dgx_spark"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
